jobs:
name: CI

on:
  push:
    branches: [ main, master, 'audit/**', 'audit/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Typecheck, Unit tests, Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . --ext .ts,.tsx

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run unit tests (Vitest - unit only)
        run: pnpm test:unit

      - name: Collect Vitest coverage (if enabled)
        if: always()
        run: |
          if [ -f vitest.config.ts ] || [ -f vitest.config.js ]; then
            pnpm exec vitest run --coverage || true
          fi

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright E2E (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Start app in background
        run: pnpm start &

      - name: Wait for app to be ready
        run: |
          n=0
          until [ $n -ge 30 ]
          do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "app ready" && break
            fi
            n=$((n+1))
            sleep 1
          done

      - name: Run MCP guard (route checks / try MCP)
        run: |
          node scripts/check-mcp.js --base http://localhost:3000 --routes "/, /contact, /rental-solutions"

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results || ./

      - name: Upload test-results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results || ./
