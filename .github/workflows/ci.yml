name: CI

on:
  push:
    branches: [ main, master, audit/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit:
    name: Lint, Typecheck, Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . --ext .ts,.tsx

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run unit tests (vitest - explicit unit tests)
        run: pnpm exec vitest run tests/deposit-calculator.test.ts
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'mcp-audit/**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -s tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (smoke + accessibility)
        run: pnpm exec playwright test --reporter=list,github,html

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload test-results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
